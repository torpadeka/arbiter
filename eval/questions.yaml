# Evaluation set for the seed corpus.
#
# Every expectation is grounded in a fact planted in data/seed/build_seed.py.
# Four categories, because they fail in different ways:
#   lookup        — one hop, one source. A vector index handles these too.
#   alias         — only resolvable because entity resolution merged surfaces.
#   conflict      — two sources disagree; the arbiter must pick the current one.
#   unanswerable  — the corpus does not contain the answer. Abstention required.
#
# `contains` is case-insensitive substring matching against the answer text.
# `gate` asserts *which* abstention gate fired, so a question that abstains for
# the wrong reason counts as a failure rather than a lucky pass.

- id: lookup-01
  category: lookup
  question: "who is ENG-4471 assigned to?"
  expect: answered
  contains: ["Sam Ratnaparkhi"]

- id: lookup-02
